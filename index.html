<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Laboratório Estatístico - Lotoce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-emerald-500 mb-6">Laboratório Estatístico Lotoce</h1>
        
        <div class="bg-slate-900 p-6 rounded-lg border border-slate-700">
            <input type="file" id="excelFile" class="mb-4 block w-full text-slate-300">
            <button onclick="iniciarAnalise()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded">
                Processar e Analisar
            </button>
            <p id="msg" class="mt-4 text-sm"></p>
        </div>

        <div id="res" class="mt-8 grid grid-cols-1 md:grid-cols-5 gap-4"></div>
    </div>

    <script>
        function iniciarAnalise() {
            const msg = document.getElementById('msg');
            const fileInput = document.getElementById('excelFile');
            
            if (!fileInput.files.length) {
                alert('Selecione o arquivo primeiro.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const workbook = XLSX.read(e.target.result, {type: 'array'});
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    console.log("Dados lidos:", json); // VEJA ISSO NO CONSOLE
                    msg.innerText = "Arquivo lido com sucesso! Processando...";
                    
                    // Lógica de cálculo aqui
                    renderizarResultados(json);
                } catch (err) {
                    msg.innerText = "Erro: " + err.message;
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        function renderizarResultados(dados) {
            const resDiv = document.getElementById('res');
            resDiv.innerHTML = '<p>Análise concluída. (Simulação de 5 números)</p>';
            // Adicione aqui sua lógica de exibir os 5 números
        }
    </script>
</body>
</html>
