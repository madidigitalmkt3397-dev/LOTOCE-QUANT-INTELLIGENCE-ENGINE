<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Estatístico Lotofácil v4.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- HEADER -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl font-black text-emerald-500">LABORATÓRIO ESTATÍSTICO <span class="text-white">LOTOFÁCIL</span></h1>
                <p class="text-slate-500 text-sm">Motor Quantitativo de Descoberta de Padrões v4.1</p>
            </div>
            <button onclick="executarMotorCompleto()" class="px-6 py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl hover:bg-emerald-400 transition shadow-lg shadow-emerald-500/20">EXECUTAR MOTOR</button>
        </header>

        <!-- CONTROLES -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">JANELA DE ANÁLISE</label>
                <select id="selectJanela" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm">
                    <option value="100">Últimos 100</option>
                    <option value="500">Últimos 500</option>
                    <option value="full">Histórico Total</option>
                </select>
            </div>
            <!-- Pesos -->
            <div><label class="block text-xs font-bold text-slate-400 mb-2">PESO FREQ.</label><input id="pesoFreq" type="number" value="1.5" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800"></div>
            <div><label class="block text-xs font-bold text-slate-400 mb-2">PESO RECÊNCIA</label><input id="pesoRec" type="number" value="2.0" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800"></div>
            <div><label class="block text-xs font-bold text-slate-400 mb-2">PESO PARIDADE</label><input id="pesoPar" type="number" value="1.0" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800"></div>
        </div>

        <!-- ABAS -->
        <div class="flex gap-2 overflow-x-auto pb-2">
            <button id="btnAba-picks" onclick="mudarAba('picks')" class="px-4 py-2 bg-emerald-500 text-slate-950 rounded-xl text-xs font-bold">PICKS</button>
            <button id="btnAba-parity" onclick="mudarAba('parity')" class="px-4 py-2 bg-slate-900 text-slate-300 rounded-xl text-xs font-bold">PARIDADE</button>
            <button id="btnAba-anatomy" onclick="mudarAba('anatomy')" class="px-4 py-2 bg-slate-900 text-slate-300 rounded-xl text-xs font-bold">ANATOMIA</button>
            <button id="btnAba-backtest" onclick="mudarAba('backtest')" class="px-4 py-2 bg-slate-900 text-slate-300 rounded-xl text-xs font-bold">VALIDAÇÃO</button>
        </div>

        <!-- CONTEÚDO DAS ABAS -->
        <div id="aba-picks" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-2 space-y-4">
                <h3 class="font-bold">Top Milhares (Score v4)</h3>
                <div id="tabelaTopMilhares" class="space-y-2"></div>
            </div>
            <div class="space-y-4">
                <h3 class="font-bold">Top Centenas</h3>
                <div id="tabelaTopCentenas" class="space-y-2"></div>
            </div>
        </div>

        <!-- AQUI ENTRARIA O RESTANTE DO CÓDIGO JavaScript (Motor e Renderizadores) -->
    </div>

    <script>
        // Variáveis Globais de Estado
        let baseHistorica = []; // Carregar aqui seus dados
        let resultadoAnalise = null;
        let historicoPerformance = JSON.parse(localStorage.getItem('lotofacil_quant_history') || '[]');

        function decomporMilhar(m) {
            let s = m.toString().padStart(4, '0');
            return {
                milhar: s,
                centena: s.slice(1),
                d1: parseInt(s[0]), d2: parseInt(s[1]), d3: parseInt(s[2]), d4: parseInt(s[3]),
                paridadeMilhar: `${parseInt(s[0])%2?'I':'P'}-${parseInt(s[1])%2?'I':'P'}-${parseInt(s[2])%2?'I':'P'}-${parseInt(s[3])%2?'I':'P'}`,
                paridadeCentena: `${parseInt(s[1])%2?'I':'P'}-${parseInt(s[2])%2?'I':'P'}-${parseInt(s[3])%2?'I':'P'}`
            };
        }

        function mudarAba(abaId) {
            // Implementação de troca de visibilidade das abas...
            console.log("Mudando para:", abaId);
        }

        function executarMotorCompleto() {
            // Lógica do motor inserida anteriormente...
            alert('Motor processando dados...');
        }
    </script>
</body>
</html>
